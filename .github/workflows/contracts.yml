name: MUSICA CI

on:
  push:
    branches: [main, m3-r1-director-provider-boundary-v0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install / 설치
        run: python -m pip install -e '.[dev]'
      - name: Test contracts, runtime, Creative Core, Project Engine, and Director boundary / 계약·런타임·Creative Core·Project Engine·Director 경계 테스트
        run: pytest
      - name: Generate canonical M0 evidence / 공식 M0 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m0_demo
          --blueprint examples/blueprints/valid/dark-electronic-20s-r1.json
          --control examples/semantic-controls/urgent-final-section.json
          --out artifacts/m0-demo
      - name: Generate canonical M1 evidence / 공식 M1 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m1_demo
          --intents
          examples/intents/dark-electronic-12s.json
          examples/intents/warm-ambient-12s.json
          examples/intents/kinetic-minimal-12s.json
          --out artifacts/m1-creative-core
      - name: Generate canonical M2 evidence / 공식 M2 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m2_demo
          --intent examples/intents/dark-electronic-12s.json
          --out artifacts/m2-project-version
      - name: Generate canonical M3-R1 evidence / 공식 M3-R1 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m3_r1_demo
          --out artifacts/m3-r1-director-boundary
      - name: Upload M0 evidence / M0 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m0-demo
          path: artifacts/m0-demo
          if-no-files-found: error
      - name: Upload M1 evidence / M1 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m1-creative-core
          path: artifacts/m1-creative-core
          if-no-files-found: error
      - name: Upload M2 evidence / M2 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m2-project-version
          path: artifacts/m2-project-version
          if-no-files-found: error
      - name: Upload M3-R1 evidence / M3-R1 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m3-r1-director-boundary
          path: artifacts/m3-r1-director-boundary
          if-no-files-found: error
