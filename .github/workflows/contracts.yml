name: MUSICA CI

on:
  push:
    branches: [main, m4-r2-browser-studio-ui-v0, m4-r3-real-browser-e2e-v0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install / 설치
        run: python -m pip install -e '.[dev]'
      - name: Test contracts, runtime, Director, Studio service, Browser Studio, and renderer boundary / 전체 계약·런타임·Studio·renderer 테스트
        run: pytest
      - name: Generate canonical M0 evidence / 공식 M0 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m0_demo
          --blueprint examples/blueprints/valid/dark-electronic-20s-r1.json
          --control examples/semantic-controls/urgent-final-section.json
          --out artifacts/m0-demo
      - name: Generate canonical M1 evidence / 공식 M1 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m1_demo
          --intents
          examples/intents/dark-electronic-12s.json
          examples/intents/warm-ambient-12s.json
          examples/intents/kinetic-minimal-12s.json
          --out artifacts/m1-creative-core
      - name: Generate canonical M2 evidence / 공식 M2 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m2_demo
          --intent examples/intents/dark-electronic-12s.json
          --out artifacts/m2-project-version
      - name: Generate canonical M3-R1 evidence / 공식 M3-R1 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m3_r1_demo
          --out artifacts/m3-r1-director-boundary
      - name: Generate canonical M3-R2 offline adapter evidence / 공식 M3-R2 오프라인 adapter 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m3_r2_demo
          --out artifacts/m3-r2-openai-adapter
      - name: Generate canonical M4-R1 Studio service evidence / 공식 M4-R1 Studio service 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m4_r1_demo
          --out artifacts/m4-r1-studio-service
      - name: Generate canonical M4-R2 Browser Studio evidence / 공식 M4-R2 Browser Studio 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m4_r2_demo
          --out artifacts/m4-r2-browser-studio
      - name: Generate canonical M5-R1 renderer evidence / 공식 M5-R1 renderer 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m5_r1_demo
          --blueprint examples/blueprints/valid/dark-electronic-20s-r1.json
          --out artifacts/m5-r1-renderer
      - name: Upload M0 evidence / M0 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m0-demo
          path: artifacts/m0-demo
          if-no-files-found: error
      - name: Upload M1 evidence / M1 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m1-creative-core
          path: artifacts/m1-creative-core
          if-no-files-found: error
      - name: Upload M2 evidence / M2 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m2-project-version
          path: artifacts/m2-project-version
          if-no-files-found: error
      - name: Upload M3-R1 evidence / M3-R1 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m3-r1-director-boundary
          path: artifacts/m3-r1-director-boundary
          if-no-files-found: error
      - name: Upload M3-R2 evidence / M3-R2 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m3-r2-openai-adapter
          path: artifacts/m3-r2-openai-adapter
          if-no-files-found: error
      - name: Upload M4-R1 evidence / M4-R1 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m4-r1-studio-service
          path: artifacts/m4-r1-studio-service
          if-no-files-found: error
      - name: Upload M4-R2 evidence / M4-R2 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m4-r2-browser-studio
          path: artifacts/m4-r2-browser-studio
          if-no-files-found: error
      - name: Upload M5-R1 renderer evidence / M5-R1 renderer 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m5-r1-renderer
          path: artifacts/m5-r1-renderer
          if-no-files-found: error

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core + browser evidence dependencies / 코어 + browser evidence 의존성 설치
        run: python -m pip install -e '.[dev,e2e]'
      - name: Install Chromium for Playwright / Playwright Chromium 설치
        run: python -m playwright install --with-deps chromium
      - name: Run M4-R3 real-browser E2E / M4-R3 실제 browser E2E 실행
        env:
          MUSICA_E2E_OUT: artifacts/m4-r3-browser-e2e
        run: pytest -q e2e/test_m4_r3_browser.py
      - name: Upload M4-R3 real-browser evidence / M4-R3 실제 browser 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-m4-r3-real-browser-e2e
          path: artifacts/m4-r3-browser-e2e
          if-no-files-found: error

  m5-r2-fluidsynth-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        shell: pwsh
        run: python -m pip install -e '.[dev]'
      - name: Provision exact FluidSynth 2.6.0 / 정확한 FluidSynth 2.6.0 준비
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/FluidSynth/fluidsynth/releases/download/v2.6.0/fluidsynth-v2.6.0-win10-x64-cpp11.zip'
          $expected = '817262deacaa748edb3af6731dffe1766b00146790becfccc949a9f701e76681'
          $archive = Join-Path $env:RUNNER_TEMP 'fluidsynth-v2.6.0-win10-x64-cpp11.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'fluidsynth-v2.6.0'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FluidSynth archive SHA-256 mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter 'fluidsynth.exe' | Select-Object -First 1
          if (-not $exe) { throw 'fluidsynth.exe not found after verified archive extraction' }
          "MUSICA_FLUIDSYNTH_BIN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSICA_FLUIDSYNTH_EXPECTED_VERSION=2.6.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSICA_FLUIDSYNTH_SOURCE_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSICA_FLUIDSYNTH_SOURCE_SHA256=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Provision exact FluidR3_GM 3.1 / 정확한 FluidR3_GM 3.1 준비
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://deb.debian.org/debian/pool/main/f/fluid-soundfont/fluid-soundfont_3.1.orig.tar.gz'
          $expected = '2621acaa1c78e4abdb24bdd163230cc577e61276936d6aa6e3180582142f0343'
          $archive = Join-Path $env:RUNNER_TEMP 'fluid-soundfont_3.1.orig.tar.gz'
          $dest = Join-Path $env:RUNNER_TEMP 'fluid-soundfont-3.1'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FluidR3 archive SHA-256 mismatch: $actual" }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          tar -xzf $archive -C $dest
          if ($LASTEXITCODE -ne 0) { throw "FluidR3 archive extraction failed: $LASTEXITCODE" }
          $sf = Get-ChildItem -Path $dest -Recurse -Filter 'FluidR3_GM.sf2' | Select-Object -First 1
          if (-not $sf) { throw 'FluidR3_GM.sf2 not found after verified source extraction' }
          "MUSICA_FLUIDSYNTH_SOUNDFONT=$($sf.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSICA_FLUIDSYNTH_SOUNDFONT_ID=FluidR3_GM-3.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSICA_FLUIDSYNTH_SOUNDFONT_SOURCE_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSICA_FLUIDSYNTH_SOUNDFONT_SOURCE_SHA256=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MUSICA_FLUIDSYNTH_SOUNDFONT_LICENSE=MIT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Preflight exact renderer/content / 정확한 renderer·content 사전 검증
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:MUSICA_FLUIDSYNTH_BIN --version
          if ($LASTEXITCODE -ne 0) { throw "FluidSynth version probe failed: $LASTEXITCODE" }
          $sfHash = (Get-FileHash $env:MUSICA_FLUIDSYNTH_SOUNDFONT -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SoundFont SHA-256: $sfHash"
          Write-Host "SoundFont bytes: $((Get-Item $env:MUSICA_FLUIDSYNTH_SOUNDFONT).Length)"
      - name: Generate M5-R2 real FluidSynth evidence / M5-R2 실제 FluidSynth 근거 생성
        shell: pwsh
        run: >-
          python -m musica.m5_r2_demo
          --blueprint examples/blueprints/valid/dark-electronic-20s-r1.json
          --out artifacts/m5-r2-fluidsynth
      - name: Upload M5-R2 evidence / M5-R2 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-m5-r2-fluidsynth
          path: artifacts/m5-r2-fluidsynth
          if-no-files-found: error
