name: MUSICA CI

on:
  push:
    branches: [main, m0-r2-minimal-deterministic-music-loop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install / 설치
        run: python -m pip install -e '.[dev]'
      - name: Test contracts and runtime / 계약 및 런타임 테스트
        run: pytest
      - name: Generate canonical M0 evidence / 공식 M0 근거 생성
        if: matrix.python-version == '3.12'
        run: >-
          python -m musica.m0_demo
          --blueprint examples/blueprints/valid/dark-electronic-20s-r1.json
          --control examples/semantic-controls/urgent-final-section.json
          --out artifacts/m0-demo
      - name: Upload M0 evidence / M0 근거 업로드
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: musica-m0-demo
          path: artifacts/m0-demo
          if-no-files-found: error
