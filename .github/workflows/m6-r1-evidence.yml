name: M6-R1 Exact-Note Edit Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-r1-exact-note-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run M6-R0/R1 contract and runtime tests / M6-R0/R1 계약·런타임 테스트
        run: pytest -q tests/test_m6_r0_contract.py tests/test_m6_r1_note_edit.py
      - name: Generate canonical M6-R1 evidence / 공식 M6-R1 근거 생성
        run: >-
          python -m musica.m6_r1_demo
          --out artifacts/m6-r1-exact-note-edit
      - name: Upload M6-R1 evidence / M6-R1 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-m6-r1-exact-note-edit
          path: artifacts/m6-r1-exact-note-edit
          if-no-files-found: error
