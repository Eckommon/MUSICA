name: M6-R2 Piano-Roll Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-r2-piano-roll-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run M6-R1/R2 precision tests / M6-R1/R2 정밀 편집 테스트
        run: pytest -q tests/test_m6_r0_contract.py tests/test_m6_r1_note_edit.py tests/test_m6_r2_studio_notes.py
      - name: Generate canonical M6-R2 evidence / 공식 M6-R2 근거 생성
        run: python -m musica.m6_r2_demo --out artifacts/m6-r2-piano-roll
      - name: Upload M6-R2 evidence / M6-R2 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-m6-r2-piano-roll
          path: artifacts/m6-r2-piano-roll
          if-no-files-found: error
