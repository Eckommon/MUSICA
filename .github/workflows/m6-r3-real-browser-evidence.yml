name: M6-R3 Real-Browser Exact-Note Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m6-r3-real-browser-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA + browser evidence dependencies / MUSICA + browser 근거 의존성 설치
        run: python -m pip install -e '.[dev,e2e]'
      - name: Install Chromium for Playwright / Playwright Chromium 설치
        run: python -m playwright install --with-deps chromium
      - name: Run M6-R1/R2 precision regressions / M6-R1/R2 정밀 편집 회귀 테스트
        run: pytest -q tests/test_m6_r1_note_edit.py tests/test_m6_r2_studio_notes.py
      - name: Run M6-R3 real-browser exact-note E2E / M6-R3 실제 browser exact-note E2E 실행
        env:
          MUSICA_M6_R3_E2E_OUT: artifacts/m6-r3-real-browser-note-e2e
        run: pytest -q e2e/test_m6_r3_browser.py
      - name: Upload M6-R3 real-browser evidence / M6-R3 실제 browser 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-m6-r3-real-browser-note-e2e
          path: artifacts/m6-r3-real-browser-note-e2e
          if-no-files-found: error
