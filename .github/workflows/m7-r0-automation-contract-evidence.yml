name: M7-R0 Automation Contract Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m7-r0-automation-contract-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run M7-R0 contract tests / M7-R0 계약 테스트
        run: pytest -q tests/test_contracts.py tests/test_m7_r0_automation_contracts.py
      - name: Generate M7-R0 evidence A / M7-R0 근거 A 생성
        env:
          MUSICA_M7_R0_EVIDENCE_OUT: artifacts/m7-r0-automation-contract-evidence-a
        run: python -m musica.m7_r0_evidence
      - name: Generate M7-R0 evidence B / M7-R0 근거 B 생성
        env:
          MUSICA_M7_R0_EVIDENCE_OUT: artifacts/m7-r0-automation-contract-evidence-b
        run: python -m musica.m7_r0_evidence
      - name: Prove byte-reproducible M7-R0 evidence / M7-R0 근거 byte 재현성 증명
        run: diff -qr artifacts/m7-r0-automation-contract-evidence-a artifacts/m7-r0-automation-contract-evidence-b
      - name: Upload M7-R0 evidence / M7-R0 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-m7-r0-automation-contract-evidence
          path: artifacts/m7-r0-automation-contract-evidence-a
          if-no-files-found: error
