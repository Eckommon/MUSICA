name: M7-R2 Real-Browser Automation Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m7-r2-real-browser-automation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA + browser evidence dependencies / MUSICA + browser 근거 의존성 설치
        run: python -m pip install -e '.[dev,e2e]'
      - name: Install Chromium for Playwright / Playwright Chromium 설치
        run: python -m playwright install --with-deps chromium
      - name: Run M7-R0/R1/R2 automation regressions / M7 자동화 회귀 테스트
        run: pytest -q tests/test_m7_r0_automation_contracts.py tests/test_m7_r1_automation_edit.py tests/test_m7_r2_studio_automation.py tests/test_m7_r2_preview_isolation.py
      - name: Run M7-R2 real-browser automation E2E / M7-R2 실제 browser automation E2E 실행
        env:
          MUSICA_M7_R2_E2E_OUT: artifacts/m7-r2-real-browser-automation-e2e
        run: pytest -q e2e/test_m7_r2_browser.py
      - name: Upload M7-R2 real-browser automation evidence / M7-R2 실제 browser automation 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-m7-r2-real-browser-automation-e2e
          path: artifacts/m7-r2-real-browser-automation-e2e
          if-no-files-found: error
