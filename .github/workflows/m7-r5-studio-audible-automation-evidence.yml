name: M7-R5 Studio Audible Automation Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m7-r5-studio-audible-automation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run Studio + M7-R0/R1/R2/R3/R4/R5 regressions / Studio + M7 자동화 회귀 테스트
        run: >-
          pytest -q
          tests/test_m4_studio.py
          tests/test_m7_r0_automation_contracts.py
          tests/test_m7_r1_automation_edit.py
          tests/test_m7_r2_studio_automation.py
          tests/test_m7_r2_preview_isolation.py
          tests/test_m7_r3_automation_lowering.py
          tests/test_m7_r4_automation_renderer.py
          tests/test_m7_r5_studio_audition.py
      - name: Generate M7-R5 evidence A / M7-R5 근거 A 생성
        run: python -m musica.m7_r5_demo --out artifacts/m7-r5-a
      - name: Generate M7-R5 evidence B / M7-R5 근거 B 생성
        run: python -m musica.m7_r5_demo --out artifacts/m7-r5-b
      - name: Prove byte-reproducible M7-R5 evidence / M7-R5 근거 byte 재현성 증명
        run: diff -qr artifacts/m7-r5-a artifacts/m7-r5-b
      - name: Upload M7-R5 Studio audible automation evidence / M7-R5 Studio 가청 자동화 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-m7-r5-studio-audible-automation-evidence
          path: artifacts/m7-r5-a
          if-no-files-found: error
