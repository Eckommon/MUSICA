name: MRAM-R0 Routing Graph Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mram-r0-routing-graph-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run MRAM-R0 regressions / MRAM-R0 회귀 테스트
        run: >-
          pytest -q
          tests/test_mram_r0_routing.py
          tests/test_contracts.py
          tests/test_atcm_r0_authority_boundary.py
      - name: Generate MRAM-R0 evidence A / MRAM-R0 근거 A 생성
        env:
          MUSICA_MRAM_R0_EVIDENCE_OUT: artifacts/mram-r0-routing-evidence-a
        run: python -m musica.mram_r0_evidence
      - name: Generate MRAM-R0 evidence B / MRAM-R0 근거 B 생성
        env:
          MUSICA_MRAM_R0_EVIDENCE_OUT: artifacts/mram-r0-routing-evidence-b
        run: python -m musica.mram_r0_evidence
      - name: Prove byte-reproducible MRAM-R0 evidence / MRAM-R0 근거 byte 재현성 증명
        run: diff -qr artifacts/mram-r0-routing-evidence-a artifacts/mram-r0-routing-evidence-b
      - name: Upload MRAM-R0 evidence / MRAM-R0 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-mram-r0-routing-evidence
          path: artifacts/mram-r0-routing-evidence-a
          if-no-files-found: error
