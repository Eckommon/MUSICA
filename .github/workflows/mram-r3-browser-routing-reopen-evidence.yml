name: MRAM-R3 Browser Routing & Reopen Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mram-r3-browser-routing-reopen-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA + browser evidence dependencies / MUSICA + browser 근거 의존성 설치
        run: python -m pip install -e '.[dev,e2e]'
      - name: Install Chromium for Playwright / Playwright Chromium 설치
        run: python -m playwright install --with-deps chromium
      - name: Run MRAM-R3 service regressions / MRAM-R3 서비스 회귀 테스트
        run: >-
          pytest -q
          tests/test_mram_r3_studio_routing.py
          tests/test_mram_r2_native_mixer_automation.py
          tests/test_mram_r1_routing_authority_mixer.py
          tests/test_m7_r2_studio_automation.py
      - name: Run MRAM-R3 real-browser lifecycle / MRAM-R3 실제 Browser lifecycle 실행
        env:
          MUSICA_MRAM_R3_E2E_OUT: artifacts/mram-r3-browser-routing-reopen-evidence
        run: pytest -q e2e/test_mram_r3_browser.py
      - name: Upload MRAM-R3 evidence / MRAM-R3 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-mram-r3-browser-routing-reopen-evidence
          path: artifacts/mram-r3-browser-routing-reopen-evidence
          if-no-files-found: error
