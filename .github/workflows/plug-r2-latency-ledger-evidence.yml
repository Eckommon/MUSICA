name: PLUG-R2 Accepted Serial Latency Ledger Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plug-r2-accepted-serial-latency-ledger-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: PLUG-R2 and inherited PLUG-R1/R0 / 직렬 지연·권한 회귀
        run: >-
          pytest -q
          tests/test_plug_r2_latency.py
          tests/test_plug_r1_accepted_plugin_authority.py
          tests/test_plug_r0_simulated_processor.py
          tests/test_mram_r1_routing_authority_mixer.py
          tests/test_mram_r2_native_mixer_automation.py
      - name: Generate PLUG-R2 evidence A / 근거 A 생성
        env:
          MUSICA_PLUG_R2_EVIDENCE_OUT: artifacts/plug-r2-latency-ledger-a
        run: python -m musica.plug_r2_evidence
      - name: Generate PLUG-R2 evidence B / 근거 B 생성
        env:
          MUSICA_PLUG_R2_EVIDENCE_OUT: artifacts/plug-r2-latency-ledger-b
        run: python -m musica.plug_r2_evidence
      - name: Verify exact byte reproducibility / 동일한 근거 바이트 검증
        run: diff -qr artifacts/plug-r2-latency-ledger-a artifacts/plug-r2-latency-ledger-b
      - name: Verify manifest payloads and numerical proof / 매니페스트 및 수치 증명
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("artifacts/plug-r2-latency-ledger-a")
          manifest = json.loads((root / "manifest.json").read_bytes())
          assert manifest["classification"] == "PLUG_R2_LEDGER_ONLY_NO_PDC_CLAIM"
          for item in manifest["artifacts"]:
              data = (root / item["path"]).read_bytes()
              assert len(data) == item["bytes"]
              assert hashlib.sha256(data).hexdigest() == item["sha256"]
          for item in manifest["contract_inventory"]:
              data = Path(item["path"]).read_bytes()
              assert len(data) == item["bytes"]
              assert hashlib.sha256(data).hexdigest() == item["sha256"]
          proof = json.loads((root / "proof.json").read_bytes())
          assert proof["numerical_frame_shift"] == 4
          assert proof["full_pcm_frame_equality_after_four_frame_shift"] is True
          assert proof["parallel_path_compensation_proven"] is False
          assert proof["forced_processor_error_head_unchanged"] is True
          assert proof["reopen_ledger_and_processed_wav_exact"] is True
          print("PLUG-R2 serial ledger manifest and numeric proof PASS")
          PY
      - name: Upload PLUG-R2 bounded evidence / 경계 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-plug-r2-serial-latency-ledger-evidence
          path: artifacts/plug-r2-latency-ledger-a
          if-no-files-found: error
