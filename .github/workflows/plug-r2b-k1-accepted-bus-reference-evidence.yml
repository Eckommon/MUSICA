name: PLUG-R2B K1 Accepted Two-Bus Detached Reference Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plug-r2b-k1-accepted-two-bus-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA
        run: python -m pip install -e '.[dev]'
      - name: Run K1 accepted-source bridge and inherited authority regression
        run: >-
          pytest -q
          tests/test_plug_r2b_k1_host_topology.py
          tests/test_plug_r2b_k1_accepted_bridge.py
          tests/test_plug_r2b_two_path_alignment_reference.py
          tests/test_plug_r2_latency.py
          tests/test_plug_r1_accepted_plugin_authority.py
          tests/test_mram_r1_routing_authority_mixer.py
      - name: Generate independent accepted-reference evidence A
        env:
          MUSICA_PLUG_R2B_K1_OUT: artifacts/plug-r2b-k1-a
        run: python tests/plug_r2b_k1_evidence.py
      - name: Generate independent accepted-reference evidence B
        env:
          MUSICA_PLUG_R2B_K1_OUT: artifacts/plug-r2b-k1-b
        run: python tests/plug_r2b_k1_evidence.py
      - name: Verify byte-identical independent evidence
        run: diff -qr artifacts/plug-r2b-k1-a artifacts/plug-r2b-k1-b
      - name: Independently verify manifest, accepted PCM and truthful scope
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import struct
          import wave
          from pathlib import Path
          root = Path("artifacts/plug-r2b-k1-a")
          manifest = json.loads((root / "manifest.json").read_bytes())
          assert manifest["classification"] == "PLUG_R2B_K1_ACCEPTED_SOURCE_DETACHED_LATENCY_EVIDENCE"
          for key in ("artifacts", "contracts"):
              for item in manifest[key]:
                  path = root / item["path"] if key == "artifacts" else Path(item["path"])
                  raw = path.read_bytes()
                  assert len(raw) == item["bytes"]
                  assert hashlib.sha256(raw).hexdigest() == item["sha256"]
          proof = json.loads((root / "proof.json").read_bytes())
          derived = json.loads((root / "derived-reference.json").read_bytes())
          assert proof["accepted_head_unchanged"] is True
          assert proof["real_native_host_pdc_claimed"] is False
          assert derived["accepted_host_plugin_authority"] is False
          assert derived["host_pdc_integrated"] is False
          def samples(name):
              with wave.open(io.BytesIO((root / name).read_bytes())) as reader:
                  assert reader.getnchannels() == 2
                  assert reader.getsampwidth() == 2
                  assert reader.getframerate() == 8000
                  return list(struct.iter_unpack("<hh", reader.readframes(reader.getnframes())))
          a = samples("input-BUS-001.wav")
          b = samples("input-BUS-002.wav")
          wet = samples("compensated.wav")
          dry = samples("uncompensated.wav")
          creative = samples("creative-preserved.wav")
          bypass = samples("bypass-recomputed.wav")
          assert a[0] == (16384, 16384) and b[0] == (8192, 8192)
          assert dry[3] == (16384, 16384)
          assert all(pair == (0, 0) for pair in wet[:9])
          assert wet[9] == (24576, 24576)
          assert creative[9] == (8192, 8192)
          assert creative[14] == (24576, 24576)
          assert bypass[9] == (24576, 24576)
          print("K1 accepted-source PCM numerical proof PASS (detached simulation only)")
          PY
      - name: Upload source-bound K1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: musica-plug-r2b-k1-accepted-two-bus-detached-reference
          path: artifacts/plug-r2b-k1-a
          if-no-files-found: error
