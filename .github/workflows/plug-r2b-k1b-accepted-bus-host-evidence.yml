name: PLUG-R2B K1-B Accepted Simulated Bus Host & Offline PDC Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plug-r2b-k1b-accepted-simulated-bus-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA
        run: python -m pip install -e '.[dev]'
      - name: K1-B accepted host and inherited audio authority regression
        run: >-
          pytest -q
          tests/test_plug_r2b_k1b_accepted_bus_host.py
          tests/test_plug_r2b_k1b_host_execution.py
          tests/test_plug_r2b_k1_accepted_bridge.py
          tests/test_plug_r2b_k1_host_topology.py
          tests/test_plug_r2b_two_path_alignment_reference.py
          tests/test_plug_r2_latency.py
          tests/test_plug_r1_accepted_plugin_authority.py
          tests/test_mram_r1_routing_authority_mixer.py
      - name: Generate exact evidence A
        env:
          MUSICA_PLUG_R2B_K1B_OUT: artifacts/plug-r2b-k1b-a
        run: python tests/plug_r2b_k1b_evidence.py
      - name: Generate exact evidence B
        env:
          MUSICA_PLUG_R2B_K1B_OUT: artifacts/plug-r2b-k1b-b
        run: python tests/plug_r2b_k1b_evidence.py
      - name: Compare full independent artifact bytes
        run: diff -qr artifacts/plug-r2b-k1b-a artifacts/plug-r2b-k1b-b
      - name: Independently inspect hashes, accepted source and actual PCM
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import struct
          import wave
          from pathlib import Path
          root = Path('artifacts/plug-r2b-k1b-a')
          manifest = json.loads((root/'manifest.json').read_bytes())
          assert manifest['classification'] == 'PLUG_R2B_K1B_ACCEPTED_SIMULATED_OFFLINE_EVIDENCE'
          for key in ('artifacts','contracts'):
              for row in manifest[key]:
                  path = root/row['path'] if key=='artifacts' else Path(row['path'])
                  raw = path.read_bytes()
                  assert len(raw) == row['bytes']
                  assert hashlib.sha256(raw).hexdigest() == row['sha256']
          proof = json.loads((root/'proof.json').read_bytes())
          assert proof['classification'] == 'K1B_ACCEPTED_SIMULATED_BUS_PROCESSOR_OFFLINE_ONLY'
          assert proof['compensation_by_bus'] == {'BUS-001':6,'BUS-002':0}
          assert proof['first_aligned_frame'] == 9
          assert proof['forced_processor_error_blocked'] is True
          assert proof['no_processors_exact_legacy_routed_wav'] is True
          assert proof['accepted_head_unchanged_by_runtime'] is True
          assert proof['reopen_exact_wav_and_plan'] is True
          assert proof['studio_pdc_integrated'] is False
          assert proof['native_third_party_latency_reporting'] is False
          def frames(filename):
              with wave.open(io.BytesIO((root/filename).read_bytes()),'rb') as reader:
                  assert reader.getnchannels()==2 and reader.getsampwidth()==2
                  assert reader.getframerate()==8000
                  return list(struct.iter_unpack('<hh',reader.readframes(reader.getnframes())))
          processed = frames('accepted-pdc.wav')
          creative = frames('creative.wav')
          bypass = frames('bypass.wav')
          assert len(processed)==96000 and processed[:9]==[(0,0)]*9
          assert processed[9]==(24576,24576)
          assert creative[9]==(8192,8192) and creative[14]==(24576,24576)
          assert bypass[9]==(8192,8192) and bypass[14]==(24576,24576)
          print('K1-B accepted simulated bus-host/PDC offline evidence PASS')
          PY
      - name: Upload K1-B accepted host evidence
        uses: actions/upload-artifact@v4
        with:
          name: musica-plug-r2b-k1b-accepted-simulated-host-evidence
          path: artifacts/plug-r2b-k1b-a
          if-no-files-found: error
