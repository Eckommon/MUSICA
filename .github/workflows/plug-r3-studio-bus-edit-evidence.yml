name: PLUG-R3 Studio Bus Host Preview Accept Authority Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plug-r3-studio-host-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA
        run: python -m pip install -e '.[dev]'
      - name: Test Studio Preview Accept, HTTP, inherited bus host and routing authority
        run: >-
          pytest -q
          tests/test_plug_r3_studio_bus_edit.py
          tests/test_plug_r2b_k2_studio_bus_plugins.py
          tests/test_plug_r2b_k1b_accepted_bus_host.py
          tests/test_plug_r2b_k1b_host_execution.py
          tests/test_plug_r2b_k1_accepted_bridge.py
          tests/test_plug_r1_accepted_plugin_authority.py
      - name: Generate Studio explicit acceptance evidence A
        env:
          MUSICA_PLUG_R3_OUT: artifacts/plug-r3-a
        run: python tests/plug_r3_studio_bus_edit_evidence.py
      - name: Generate Studio explicit acceptance evidence B
        env:
          MUSICA_PLUG_R3_OUT: artifacts/plug-r3-b
        run: python tests/plug_r3_studio_bus_edit_evidence.py
      - name: Verify A/B byte-identical source and PCM evidence
        run: diff -qr artifacts/plug-r3-a artifacts/plug-r3-b
      - name: Verify all manifest members and independent PCM source oracle
        run: |
          python - <<'PY'
          import json,hashlib,io,wave,struct
          from pathlib import Path
          root=Path("artifacts/plug-r3-a")
          manifest=json.loads((root/"manifest.json").read_bytes())
          assert manifest["classification"]=="PLUG_R3_STUDIO_BUS_HOST_AUTHORITY_EVIDENCE"
          for label in ("artifacts","contracts"):
              for row in manifest[label]:
                  p=root/row["path"] if label=="artifacts" else Path(row["path"])
                  raw=p.read_bytes()
                  assert len(raw)==row["bytes"]
                  assert hashlib.sha256(raw).hexdigest()==row["sha256"]
          proof=json.loads((root/"proof.json").read_bytes())
          assert proof["preview_left_head_unchanged"]
          assert proof["explicit_accept_advanced_exactly_one_revision"]
          assert proof["generic_studio_audio_unchanged"]
          assert proof["export_reopen_exact_plan_and_wav"]
          assert proof["browser_graphical_editor_proven"] is False
          assert proof["native_realtime_plugin_host_proven"] is False
          left=(root/"preview.wav").read_bytes()
          right=(root/"accepted-replay.wav").read_bytes()
          assert left==right
          with wave.open(io.BytesIO(left)) as w:
              assert w.getframerate()==8000 and w.getnchannels()==2 and w.getsampwidth()==2
              pcm=list(struct.iter_unpack("<hh",w.readframes(w.getnframes())))
              assert len(pcm)==96000
              assert pcm[:9]==[(0,0)]*9 and pcm[9]==(24576,24576)
          print("Studio accepted bus plugin Preview->Accept and PCM oracle PASS")
          PY
      - name: Upload source-bound Studio Preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: musica-plug-r3-studio-preview-accept-offline
          path: artifacts/plug-r3-a
          if-no-files-found: error
