name: PROD-E2E R1B G2C Browser Native Gain Lane Authority

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-r1b-g2c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install / 설치
        run: python -m pip install -e '.[dev,e2e]'
          python -m playwright install --with-deps chromium
      - name: Check Browser syntax, lane candidate and inherited automation / 브라우저 검사
        run: |
          node --check src/musica/studio_web/automation_editing.js
          pytest -q tests/test_prod_e2e_r1b_g2c_lane.py tests/test_mram_r3_studio_routing.py tests/test_prod_e2e_r1b_g2b_bootstrap.py
      - name: Real Chromium native gain automation and numerical WAV comparison
        run: python -m musica.prod_e2e_r1b_g2c_browser --out artifacts/prod-r1b-g2c
      - name: Upload proof and WAVs
        uses: actions/upload-artifact@v4
        with:
          name: musica-prod-e2e-r1b-g2c-gain-automation
          path: |
            artifacts/prod-r1b-g2c/*.json
            artifacts/prod-r1b-g2c/*.png
            artifacts/prod-r1b-g2c/*.wav
          if-no-files-found: error
