name: PROD-E2E R2A G3B0 Bounded Private WAV Staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-g3b0-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MUSICA test extras / 설치
        run: python -m pip install -e '.[dev]'
      - name: Private chunk ordering, hashes, session, size, cancel and cleanup / 검증
        run: |
          python -m compileall -q src/musica/staged_wav.py
          pytest -q tests/test_prod_e2e_r2a_g3b0_staging.py tests/test_prod_e2e_r2a_g3a_rates.py tests/test_prod_e2e_r1a_browser_import.py
