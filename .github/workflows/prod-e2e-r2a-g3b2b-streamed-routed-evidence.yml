name: PROD-E2E R2A G3B2B Bounded Routed PCM Automation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routed-long-song:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install developer tests
        run: python -m pip install -e '.[dev]'
      - name: Numeric routing + automation parity and 180-second bus/master WAV
        env:
          MUSICA_G3B2B_ARTIFACT_DIR: artifacts/g3b2b
        run: |
          python -m compileall -q src/musica/streamed_routed_mixer.py
          /usr/bin/time -v pytest -q tests/test_prod_e2e_r2a_g3b2b_streamed_routed.py tests/test_mram_r2_native_mixer_automation.py
      - name: Verify out-of-order accepted routing Browser GET cannot overwrite HEAD
        run: |
          node --check src/musica/studio_web/routing_editing.js
          node tests/test_g3b2b_routing_projection_epoch.cjs
      - name: Upload inspectable routed 180-second audio / 검증 산출물
        uses: actions/upload-artifact@v4
        with:
          name: musica-prod-e2e-r2a-g3b2b-routed-180s
          path: |
            artifacts/g3b2b/*.wav
            artifacts/g3b2b/*.json
          if-no-files-found: error
