name: PROD-E2E R2A G3B2C-R3 Bounded Studio Long-Audio Views

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-native-routed-views:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native Studio developer tests
        run: python -m pip install -e '.[dev,e2e]'
      - name: Reject full-buffer 180s accepted/Preview renders during read-only inspection
        run: |
          python -m compileall -q src/musica/studio_audio.py src/musica/studio_routing.py
          /usr/bin/time -v pytest -q tests/test_prod_e2e_r2a_g3b2c_r3_bounded_projections.py
      - name: Check both first-party Browser player route selectors
        run: |
          node --check src/musica/studio_web/native_audio.js
          node --check src/musica/studio_web/routing_editing.js
          grep -q LONG_ACCEPTED_AUDIO_STREAM_REQUIRED src/musica/studio_web/native_audio.js
          grep -q LONG_ACCEPTED_AUDIO_STREAM_REQUIRED src/musica/studio_web/routing_editing.js
      - name: Install real Chromium and system audio dependencies
        run: python -m playwright install --with-deps chromium
      - name: First-party Chromium 180s accepted player metadata via HTTP Range
        env:
          MUSICA_G3B2C_R3_ARTIFACT_DIR: artifacts/g3b2c-r3-browser
        run: |
          pytest -q tests/test_prod_e2e_r2a_g3b2c_r3_browser.py
      - name: Upload real 180s Browser proof and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: musica-prod-e2e-r2a-g3b2c-r3-browser-180s
          path: |
            artifacts/g3b2c-r3-browser/proof.json
            artifacts/g3b2c-r3-browser/*.png
          if-no-files-found: error
