name: REC-R1 Recording Finalize Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rec-r1-recording-finalize-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run REC-R1 regressions / REC-R1 회귀 테스트
        run: >-
          pytest -q
          tests/test_rec_r1_recording_finalize.py
          tests/test_rec_r0_capture.py
          tests/test_atcm_r1_audio_authority.py
          tests/test_mram_r1_routing_authority_mixer.py
      - name: Generate REC-R1 evidence A / REC-R1 근거 A 생성
        env:
          MUSICA_REC_R1_EVIDENCE_OUT: artifacts/rec-r1-recording-finalize-a
        run: python -m musica.rec_r1_evidence
      - name: Generate REC-R1 evidence B / REC-R1 근거 B 생성
        env:
          MUSICA_REC_R1_EVIDENCE_OUT: artifacts/rec-r1-recording-finalize-b
        run: python -m musica.rec_r1_evidence
      - name: Prove byte-reproducible REC-R1 evidence / REC-R1 근거 byte 재현성 증명
        run: diff -qr artifacts/rec-r1-recording-finalize-a artifacts/rec-r1-recording-finalize-b
      - name: Upload REC-R1 evidence / REC-R1 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-rec-r1-recording-finalize-evidence
          path: artifacts/rec-r1-recording-finalize-a
          if-no-files-found: error
