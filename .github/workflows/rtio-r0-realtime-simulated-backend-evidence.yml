name: RTIO-R0 Realtime Simulated Backend Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtio-r0-realtime-simulated-backend-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run RTIO-R0 regressions / RTIO-R0 회귀 테스트
        run: >-
          pytest -q
          tests/test_rtio_r0_realtime_simulated_backend.py
          tests/test_mram_r3_studio_routing.py
          tests/test_mram_r2_native_mixer_automation.py
          tests/test_mram_r1_routing_authority_mixer.py
      - name: Generate RTIO-R0 evidence A / RTIO-R0 근거 A 생성
        env:
          MUSICA_RTIO_R0_EVIDENCE_OUT: artifacts/rtio-r0-realtime-simulated-backend-a
        run: python -m musica.rtio_r0_evidence
      - name: Generate RTIO-R0 evidence B / RTIO-R0 근거 B 생성
        env:
          MUSICA_RTIO_R0_EVIDENCE_OUT: artifacts/rtio-r0-realtime-simulated-backend-b
        run: python -m musica.rtio_r0_evidence
      - name: Prove byte-reproducible RTIO-R0 evidence / RTIO-R0 근거 byte 재현성 증명
        run: diff -qr artifacts/rtio-r0-realtime-simulated-backend-a artifacts/rtio-r0-realtime-simulated-backend-b
      - name: Upload RTIO-R0 evidence / RTIO-R0 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-rtio-r0-realtime-simulated-backend-evidence
          path: artifacts/rtio-r0-realtime-simulated-backend-a
          if-no-files-found: error
