name: RTIO-R1 Callback Engine Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtio-r1-callback-engine-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run RTIO-R1 regressions / RTIO-R1 회귀 테스트
        run: >-
          pytest -q
          tests/test_rtio_r1_callback_engine.py
          tests/test_rtio_r0_realtime_simulated_backend.py
          tests/test_mram_r3_studio_routing.py
          tests/test_mram_r2_native_mixer_automation.py
      - name: Generate RTIO-R1 evidence A / RTIO-R1 근거 A 생성
        env:
          MUSICA_RTIO_R1_EVIDENCE_OUT: artifacts/rtio-r1-callback-engine-a
        run: python -m musica.rtio_r1_evidence
      - name: Generate RTIO-R1 evidence B / RTIO-R1 근거 B 생성
        env:
          MUSICA_RTIO_R1_EVIDENCE_OUT: artifacts/rtio-r1-callback-engine-b
        run: python -m musica.rtio_r1_evidence
      - name: Prove byte-reproducible RTIO-R1 evidence / RTIO-R1 근거 byte 재현성 증명
        run: diff -qr artifacts/rtio-r1-callback-engine-a artifacts/rtio-r1-callback-engine-b
      - name: Upload RTIO-R1 evidence / RTIO-R1 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-rtio-r1-callback-engine-evidence
          path: artifacts/rtio-r1-callback-engine-a
          if-no-files-found: error
