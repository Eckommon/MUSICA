name: RTIO-R2 Exact-Frame Transport Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtio-r2-exact-frame-transport-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MUSICA / MUSICA 설치
        run: python -m pip install -e '.[dev]'
      - name: Run RTIO-R2 regressions / RTIO-R2 회귀 테스트
        run: >-
          pytest -q
          tests/test_rtio_r2_transport.py
          tests/test_rtio_r1_callback_engine.py
          tests/test_rtio_r0_realtime_simulated_backend.py
      - name: Generate RTIO-R2 evidence A / RTIO-R2 근거 A 생성
        env:
          MUSICA_RTIO_R2_EVIDENCE_OUT: artifacts/rtio-r2-exact-frame-transport-a
        run: python -m musica.rtio_r2_evidence
      - name: Generate RTIO-R2 evidence B / RTIO-R2 근거 B 생성
        env:
          MUSICA_RTIO_R2_EVIDENCE_OUT: artifacts/rtio-r2-exact-frame-transport-b
        run: python -m musica.rtio_r2_evidence
      - name: Prove byte-reproducible RTIO-R2 evidence / RTIO-R2 근거 byte 재현성 증명
        run: diff -qr artifacts/rtio-r2-exact-frame-transport-a artifacts/rtio-r2-exact-frame-transport-b
      - name: Upload RTIO-R2 evidence / RTIO-R2 근거 업로드
        uses: actions/upload-artifact@v4
        with:
          name: musica-rtio-r2-exact-frame-transport-evidence
          path: artifacts/rtio-r2-exact-frame-transport-a
          if-no-files-found: error
