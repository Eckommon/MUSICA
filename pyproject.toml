[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musica-core"
version = "0.0.1"
description = "MUSICA programmable music core / MUSICA 프로그래머블 음악 코어"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "lxml>=5.3,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]
e2e = [
  "playwright>=1.55,<2",
]

[project.scripts]
musica-studio = "musica.studio_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"musica.studio_web" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
